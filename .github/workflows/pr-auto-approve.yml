name: Test and auto-approve PR

# Approves a PR when all tests pass and coverage of rag-system/app is >= 90%.
# Otherwise requests changes, which replaces any earlier bot approval.
# Posts a per-file coverage table as a single PR comment, updated on each push.
# Requires: Settings > Actions > General > Workflow permissions >
#   "Allow GitHub Actions to create and approve pull requests".

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: 90

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rag-system/requirements.txt
            rag-system/requirements-dev.txt

      # CPU-only torch keeps the install small; tests stub the models anyway
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        id: tests
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Build coverage report
        if: always() && hashFiles('rag-system/.coverage') != ''
        env:
          OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            status="✅ Passed"
          else
            status="❌ Failed"
          fi
          # e.g. "27 passed in 20.1s" from pytest's final summary line
          results=$(grep -E '^=+ .*(passed|failed|error).* =+$' pytest-output.txt | tail -n 1 | sed -E 's/^=+ | =+$//g')

          {
            echo "<!-- coverage-report -->"
            echo "## Test coverage: $status"
            echo
            echo "**Tests:** ${results:-see run log} &nbsp;|&nbsp; **Required coverage:** ${COVERAGE_THRESHOLD}%"
            echo
            python -m coverage report --format=markdown --show-missing
            echo
            echo "[View workflow run]($RUN_URL)"
          } > coverage-comment.md

          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place on every push
      - name: Post coverage comment on PR
        if: always() && hashFiles('rag-system/coverage-comment.md') != '' && !github.event.pull_request.head.repo.fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id' \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@coverage-comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file coverage-comment.md
          fi

  approve:
    needs: test
    if: success() && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: |
          gh pr review "$PR" --approve \
            --body "All tests passed and coverage is at least ${COVERAGE_THRESHOLD}%."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

  request-changes:
    needs: test
    if: failure() && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Request changes
        run: |
          gh pr review "$PR" --request-changes \
            --body "Auto-approval blocked: tests failed or coverage is below ${COVERAGE_THRESHOLD}%. See ${RUN_URL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
